# ─────────────────────────────────────────────────────────────────────
# MAPS 변수 매핑 — 심리학 구성개념 ↔ 실제 원자료 컬럼명
#
# 🔴 규칙: 컬럼명을 절대 추측하지 않는다.
#    코드북 / 조사표 / 원자료 세 곳에서 확인된 것만 items 에 적는다.
#    확인 전에는 items: [] 로 비워 둔다. 빈 구성개념은 파이프라인에서
#    자동으로 건너뛰고 reports/data_quality.md 에 "미검증"으로 보고된다.
#
# status 값: unverified | verified | unavailable
#   unverified  = 아직 코드북 확인 안 함 (기본값)
#   verified    = 코드북에서 문항 번호·범위·역채점을 모두 확인함
#   unavailable = 코드북 확인 결과 해당 차수에 없는 변수
#
# 채우는 시점: 2차시 (코드북 수령 후)
#
# ── 2차시 검증 기록 (2026-08-12) ──────────────────────────────────────
#  근거 ① 코드북: ★(한글판) MAPS 1기패널 청소년 코드북  (중영역/소영역 대조)
#         → reports/codebook_candidates.md · configs/variables_proposed.yaml
#  근거 ② 원자료: 청소년 5·6차 CSV 실측 — 아래 items 전 컬럼이 헤더에 존재하고,
#         참여자(SURVEY1_wN==1) 기준 관측값이 expected_range 안에 전부 들어온다
#         (범위밖 0건 · 참여자 결측셀 0건). 5차 1,347명 · 6차 1,329명 · 병합 1,321명.
#  근거 ③ 조사표(PDF): 문항수·응답범주 대조.
#
#  ⚠️ reverse_items 는 지금 전부 비어 있다 — 이건 "역채점이 없다"는 뜻이 아니라
#     "아직 방향을 데이터로 확인하지 않았다"는 뜻이다. 3차시에 문항-전체 상관으로
#     방향을 검증한 뒤 이 파일에 적어 넣는다. 검증은 계속되는 상태다.
#
#  5차 미측정이라 후보에서 제외한 척도: 자아존중감Ⅱ · 교우관계(적응)Ⅱ · 학교적응:학업
#
# 📋 코드북·실데이터 대조가 끝난 변수 후보 목록이 준비되어 있다:
#    python scripts/codebook_candidates.py → reports/codebook_candidates.md
#    (join 키는 PID다. ID 는 가구 ID — 절대 쓰지 말 것)
# ─────────────────────────────────────────────────────────────────────

meta:
  study: "MAPS 1기 (다문화청소년패널조사 제1기 패널)"
  predictor_wave: 5      # 2015, 중2
  target_wave: 6         # 2016, 중3
  codebook_verified: true    # ★ Human Review Gate — 2차시 검증 완료 후 사람이 연다

id:
  wave5: PID             # 개인 ID. ID 는 가구 ID 라 중복된다 — join 에 쓰면 안 된다
  wave6: PID

# 결측 코드. CSV 의 결측은 공백(' ') 이고 io.py 가 NaN 으로 읽는다.
# 척도 문항에서 숫자 결측코드는 실측되지 않았다 → 비워 둔다 (추측 금지).
missing_codes: []

target:
  name: acculturative_stress_w6
  wave: 6
  status: verified
  note: "문화적응스트레스(이중문화 경험) · 코드북 10문항 = 실측 10문항 · 1~4점"
  # 선행연구 기준 기대 사양(체크리스트일 뿐, 코드북으로 확정):
  #   10문항 · 4점 Likert · SAFE(Hong 2003) · Cronbach α ≈ .74
  expected_n_items: 10
  expected_range: [1, 4]
  items:
    - s_accul_str_01_w6
    - s_accul_str_02_w6
    - s_accul_str_03_w6
    - s_accul_str_04_w6
    - s_accul_str_05_w6
    - s_accul_str_06_w6
    - s_accul_str_07_w6
    - s_accul_str_08_w6
    - s_accul_str_09_w6
    - s_accul_str_10_w6
  reverse_items: []      # 3차시에 방향 검증 (s_accul_str_10 이 후보로 지목돼 있다)
  scoring:
    method: mean         # mean | sum
    min_valid_items: 8   # 이보다 적게 응답하면 결측 처리

